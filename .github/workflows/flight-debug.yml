name: flight-debug (임시)
on:
  push:
    branches: [claude/quirky-brahmagupta-xynomy]
    paths: [".github/workflows/flight-debug.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r flight-watch/requirements.txt
      - run: |
          mkdir -p dump && python - <<'PY'
          import sys, time
          sys.path.insert(0, "flight-watch")
          from fast_flights import FlightQuery, Passengers, create_query, fetch_flights_html
          for bags in (0, 1):
              q = create_query(flights=[FlightQuery(date="2026-12-19", from_airport="ICN", to_airport="KIX", max_stops=0),
                                        FlightQuery(date="2026-12-22", from_airport="KIX", to_airport="ICN", max_stops=0)],
                               trip="round-trip", passengers=Passengers(adults=1), language="ko", currency="KRW", checked_bags=bags)
              for attempt in range(4):
                  html = fetch_flights_html(q)
                  if "errorHasStatus: true" not in html: break
                  time.sleep(5)
              open(f"dump/bags{bags}.html", "w").write(html)
              print(bags, len(html))
              time.sleep(3)
          PY
          cd dump && git init -q && git checkout -q -b tmp-dump && git config user.name bot && git config user.email bot@example.com
          git add . && git commit -qm dump && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" tmp-dump
