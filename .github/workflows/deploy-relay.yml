name: 중계기 설치 (Cloudflare Worker)

# 텔레그램 명령을 1~2분 안에 처리하게 하는 중계기를 Cloudflare에 설치해요.
# 필요한 Secrets: CLOUDFLARE_API_TOKEN, RELAY_GITHUB_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# 자세한 건 flight-watch/relay/README.md

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "install = 설치/업데이트, diagnose = 왜 안 되는지 점검"
        type: choice
        default: install
        options: [install, diagnose]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      WORKER_NAME: flight-watch-relay
      KV_TITLE: flight-watch-state
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 설정 확인
        env:
          CF_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_RAW: ${{ secrets.RELAY_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          missing=""
          [ -n "$CF_RAW" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$GH_RAW" ] || missing="$missing RELAY_GITHUB_TOKEN"
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::저장소 Secrets에 다음이 없어요:$missing  (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # 붙여 넣을 때 "Bearer ..."나 예시 명령 전체가 같이 들어가도 토큰만 골라내요.
          # 토큰 길이를 가정하지 않고, 영문·숫자·_·- 로만 된 가장 긴 조각(32자 이상)을 토큰으로 봐요.
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$CF_RAW" | tr -d '\r\n' | sed -E 's/.*Bearer[[:space:]]+//' | grep -oE '[A-Za-z0-9_-]{32,}' | awk '{ print length, $0 }' | sort -rn | head -1 | cut -d' ' -f2- || true)
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN에서 토큰 모양(영문·숫자 32자 이상)을 찾을 수 없어요. 토큰을 다시 만들어 그 값만 넣어 주세요."; exit 1
          fi
          echo "고른 Cloudflare 토큰 길이: ${#CLOUDFLARE_API_TOKEN}"
          RELAY_GITHUB_TOKEN=$(printf '%s' "$GH_RAW" | tr -d '\r\n' | grep -oE '(github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+)' | head -1 || true)
          if [ -z "$RELAY_GITHUB_TOKEN" ]; then
            echo "::error::RELAY_GITHUB_TOKEN에서 토큰 모양(github_pat_로 시작)을 찾을 수 없어요."; exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"; echo "::add-mask::$RELAY_GITHUB_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "RELAY_GITHUB_TOKEN=$RELAY_GITHUB_TOKEN" >> "$GITHUB_ENV"
          # 값의 모양만 기록해요 (내용은 찍지 않아요). 문제 원인을 찾을 때 써요.
          echo "CLOUDFLARE_API_TOKEN 원본: 길이 ${#CF_RAW}, 공백 $(printf '%s' "$CF_RAW" | tr -cd ' \t' | wc -c)개, Bearer 포함: $(printf '%s' "$CF_RAW" | grep -c Bearer), curl 포함: $(printf '%s' "$CF_RAW" | grep -c curl), 토큰 모양 조각 $(printf '%s' "$CF_RAW" | tr -d '\r\n' | grep -oE '[A-Za-z0-9_-]{32,}' | wc -l)개"
          # GitHub 토큰이 이 저장소의 워크플로를 돌릴 수 있는지 미리 확인
          code=$(curl -s -o /tmp/gh.json -w "%{http_code}" \
            -H "Authorization: Bearer $RELAY_GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/flight-bot.yml")
          if [ "$code" != "200" ]; then
            echo "::error::RELAY_GITHUB_TOKEN으로 이 저장소의 Actions를 읽을 수 없어요 (HTTP $code). 토큰의 저장소 선택과 Actions 권한(Read and write)을 확인하세요."
            cat /tmp/gh.json; exit 1
          fi
          code=$(curl -s -o /tmp/gh2.json -w "%{http_code}" \
            -H "Authorization: Bearer $RELAY_GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/flight-watch/config.json")
          if [ "$code" != "200" ]; then
            echo "::error::RELAY_GITHUB_TOKEN에 Contents(저장소 내용) 권한이 없어요 (HTTP $code). 토큰 설정에서 Repository permissions → Contents: Read and write 를 추가하세요. https://github.com/settings/personal-access-tokens"
            exit 1
          fi
          echo "GitHub 토큰 OK (Actions, Contents)"

      - name: Cloudflare 계정 찾기
        id: cf
        run: |
          resp=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts")
          ok=$(echo "$resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.success?"1":"0")})')
          if [ "$ok" != "1" ]; then
            echo "::error::Cloudflare API 토큰이 동작하지 않아요. 토큰을 만든 직후 화면의 Copy 버튼으로 복사한 값인지, 템플릿이 'Edit Cloudflare Workers'인지 확인하세요."; echo "$resp"; exit 1
          fi
          n=$(echo "$resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result.length))')
          if [ "$n" = "0" ]; then
            echo "::error::이 토큰으로 볼 수 있는 Cloudflare 계정이 없어요. 토큰 만들 때 'Edit Cloudflare Workers' 템플릿을 쓰고 계정 범위를 넣어 주세요."; exit 1
          fi
          id=$(echo "$resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result[0].id))')
          name=$(echo "$resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result[0].name))')
          echo "계정: $name ($n개 중 첫 번째)"
          echo "::add-mask::$id"
          echo "account_id=$id" >> "$GITHUB_OUTPUT"

      - name: KV 저장소 준비
        id: kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        working-directory: flight-watch/relay
        run: |
          npm i -g wrangler@4 >/dev/null 2>&1
          existing=$(npx wrangler kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const f=a.find(x=>x.title===process.env.KV_TITLE||x.title.endsWith("-"+process.env.KV_TITLE));console.log(f?f.id:"")}catch(e){console.log("")}})')
          if [ -z "$existing" ]; then
            echo "KV 저장소 새로 만들기"
            out=$(npx wrangler kv namespace create "$KV_TITLE" 2>&1) || { echo "$out"; exit 1; }
            existing=$(echo "$out" | grep -oE '"?id"?\s*[:=]\s*"[0-9a-f]{32}"' | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          [ -n "$existing" ] || { echo "::error::KV 저장소 id를 알 수 없어요"; exit 1; }
          echo "kv_id=$existing" >> "$GITHUB_OUTPUT"
          echo "KV OK"

      - name: workers.dev 주소 준비
        id: sub
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log((j.success&&j.result&&j.result.subdomain)||"")})')
          if [ -z "$sub" ]; then
            want="fw-$(echo "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-8)"
            echo "workers.dev 주소가 없어서 만들어요: $want"
            resp=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$api" -d "{\"subdomain\":\"$want\"}")
            sub=$(echo "$resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log((j.success&&j.result&&j.result.subdomain)||"")})')
            [ -n "$sub" ] || { echo "::error::workers.dev 주소를 만들지 못했어요. Cloudflare 대시보드 → Workers & Pages 에서 한 번 열어 주소(subdomain)를 등록한 뒤 다시 실행하세요."; echo "$resp"; exit 1; }
          fi
          echo "subdomain=$sub" >> "$GITHUB_OUTPUT"
          echo "Worker 주소: https://$WORKER_NAME.$sub.workers.dev"

      - name: Worker 올리기
        if: inputs.mode != 'diagnose'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          KV_ID: ${{ steps.kv.outputs.kv_id }}
        working-directory: flight-watch/relay
        run: |
          cat > wrangler.toml <<TOML
          name = "$WORKER_NAME"
          main = "worker.js"
          compatibility_date = "2025-01-01"
          workers_dev = true

          [observability]
          enabled = true

          [[kv_namespaces]]
          binding = "STATE"
          id = "$KV_ID"

          [vars]
          GITHUB_REPO = "${{ github.repository }}"
          GITHUB_BRANCH = "${{ github.event.repository.default_branch }}"
          TOML
          npx wrangler deploy

      - name: 비밀값 넣기
        if: inputs.mode != 'diagnose'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUB: ${{ steps.sub.outputs.subdomain }}
        working-directory: flight-watch/relay
        run: |
          [ -n "$TELEGRAM_CHAT_ID" ] || { echo "::error::TELEGRAM_CHAT_ID Secret이 필요해요."; exit 1; }
          WEBHOOK_SECRET=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)
          echo "::add-mask::$WEBHOOK_SECRET"
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$RELAY_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET

          url="https://$WORKER_NAME.$SUB.workers.dev/telegram"
          echo "텔레그램 웹훅 등록: $url"
          resp=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"$url\",\"secret_token\":\"$WEBHOOK_SECRET\",\"allowed_updates\":[\"message\"],\"drop_pending_updates\":false}")
          echo "$resp" | grep -q '"ok":true' || { echo "::error::텔레그램 웹훅 등록 실패"; echo "$resp"; exit 1; }

          # "/" 메뉴 (영문 명령만 허용되는 텔레그램 규칙)
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setMyCommands" -H "Content-Type: application/json" -d '{"commands":[
            {"command":"list","description":"감시 중인 여행지와 기준가, 역대 최저가"},
            {"command":"price","description":"기준가 바꾸기: /price 도쿄 35만"},
            {"command":"add","description":"여행지 추가: /add 방콕 BKK 12-01 2-28 45만"},
            {"command":"del","description":"여행지 빼기: /del 방콕"},
            {"command":"pax","description":"인원: /pax 2 (여행지만: /pax 도쿄 4)"},
            {"command":"period","description":"출발 기간: /period 도쿄 2027-01-01 2027-03-31"},
            {"command":"nights","description":"박수: /nights 도쿄 2,3"},
            {"command":"days","description":"출발 요일: /days 도쿄 목,금,토 (매일은 전부)"},
            {"command":"origin","description":"출발 공항: /origin GMP"},
            {"command":"summary","description":"지금 최저가 요약 받기 (3~5분)"},
            {"command":"reset","description":"가격 기록 지우기"},
            {"command":"help","description":"명령어 안내"}]}' >/dev/null
          echo "설치 완료. 텔레그램 봇에게 /list 를 보내면 1~2초 안에 답장이 와요."

      - name: 진단
        if: inputs.mode == 'diagnose'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          KV_ID: ${{ steps.kv.outputs.kv_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: flight-watch/relay
        run: |
          echo "### 0) 텔레그램 웹훅 상태 (url이 있고 last_error 가 없어야 정상)"
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getWebhookInfo" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const r=j.result||{};console.log(" url:",r.url||"(없음 → 폴링 모드)");console.log(" 대기:",r.pending_update_count,"last_error:",r.last_error_message||"(없음)",r.last_error_date?new Date(r.last_error_date*1000).toISOString():"")})'
          echo
          echo "### 1) 텔레그램에 아직 봇이 읽지 않은 메시지 (웹훅 모드면 409가 정상)"
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getUpdates?timeout=0" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok){console.log("오류:",JSON.stringify(j));return}console.log("대기 중:",j.result.length,"건");for(const u of j.result){const m=u.message||{};console.log(" - update_id",u.update_id,"chat",m.chat&&m.chat.id,"내 채팅:",String(m.chat&&m.chat.id)===process.env.TELEGRAM_CHAT_ID,"길이",(m.text||"").length)}})'
          echo
          echo "### 2) Worker가 KV에 남긴 값"
          for k in last_dispatched_id last_dispatched_at; do
            v=$(npx wrangler kv key get --namespace-id "$KV_ID" --remote "$k" 2>/dev/null || true)
            echo " - $k = ${v:-(없음)}"
          done
          echo
          echo "### 3) Cloudflare에 등록된 Worker와 타이머"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.success?"타이머: "+JSON.stringify((j.result.schedules||[]).map(x=>x.cron)):"오류: "+JSON.stringify(j.errors))})'
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success){console.log("settings 오류:",JSON.stringify(j.errors));return}console.log("바인딩:",JSON.stringify((j.result.bindings||[]).map(b=>b.type+":"+b.name)))})'
          echo
          echo "### 4) 최근 Worker 실행 기록 (관측 로그, 켜져 있을 때만)"
          now=$(date +%s%3N); from=$((now - 30*60*1000))
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            -d "{\"queryId\":\"diag\",\"timeframe\":{\"from\":$from,\"to\":$now},\"parameters\":{\"datasets\":[\"cloudflare-workers\"],\"filters\":[{\"key\":\"\$metadata.service\",\"operation\":\"eq\",\"value\":\"$WORKER_NAME\",\"type\":\"string\"}],\"limit\":20},\"view\":\"events\"}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(!j.success){console.log("조회 불가:",JSON.stringify(j.errors).slice(0,300));return}const ev=(j.result&&j.result.events&&j.result.events.events)||[];console.log("최근 30분 실행:",ev.length,"건");for(const e of ev.slice(0,10)){const m=e.$metadata||{};console.log(" -",new Date(e.timestamp).toISOString(),m.trigger||m.type||"",m.outcome||"",m.message||"",JSON.stringify(e.$workers&&e.$workers.event&&e.$workers.event.scheduledTime||"").slice(0,40))}}catch(err){console.log("파싱 실패:",s.slice(0,300))}})'
          echo
          echo "### 5) GitHub 깨우기 권한 직접 시험 (성공하면 봇 실행이 하나 생겨요)"
          code=$(curl -s -o /tmp/d.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $RELAY_GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/flight-bot.yml/dispatches" \
            -d '{"ref":"${{ github.event.repository.default_branch }}"}')
          echo "HTTP $code $( [ "$code" = "204" ] && echo '→ 성공' || cat /tmp/d.txt )"
